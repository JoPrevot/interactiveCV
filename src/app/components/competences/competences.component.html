<div class="competences-container">
  <!-- Soft Skills -->
  <div
    class="competences-section soft-skills"
    [class.active]="selectedSection === 'soft'"
    [class.inactive]="selectedSection === 'hard'"
    (click)="selectSection('soft')"
  >
    <h2>Soft Skills</h2>
    <div class="skills-list">
      <div class="skills-wrapper">
        <div class="skills-wrapper-title">
          <span>SOFT SKILLS</span>
        </div>
        <div *ngFor="let skill of competences.softSkills" class="skill">
          <span>{{ skill.name }}</span>
          <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="skill.level" [title]="skill.info ? skill.info : skill.level + '%'"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Hard Skills -->
  <div
    class="competences-section hard-skills"
    [class.active]="selectedSection === 'hard'"
    [class.inactive]="selectedSection === 'soft'"
    (click)="selectSection('hard')"
  >
    <h2>Hard Skills</h2>
    <div class="skills-list">
      <div class="skills-wrapper">
        <div class="skills-wrapper-title">
          <span>SKILLS TECHNIQUES</span>
        </div>
        <div *ngFor="let skill of competences.hardSkills" class="skill">
          <span>{{ skill.name }}</span>
          <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="skill.level" [title]="skill.info ? skill.info : skill.level + '%'"></div>
          </div>
        </div>
      </div>
      <div class="skills-wrapper">
        <div class="skills-wrapper-title">
          <span>SKILLS TRANSVERSES</span>
        </div>
        <div *ngFor="let skill of competences.hardSkillsBis" class="skill">
          <span>{{ skill.name }}</span>
          <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="skill.level" [title]="skill.info ? skill.info : skill.level + '%'"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
